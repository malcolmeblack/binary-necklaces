%YAML 1.2
---
metadata:
  title: Binary Necklaces
  author: Malcolm Emerson Black
  year: 2026
  edition: 3
  source: /binary-necklaces.html
  description: Terminology and reference definitions aligned with the current exposition. Binary words
    and branching sequences are strings; leading zeros are significant.
  compatibility: Historical concept keys are mapped below to recognize older questions; use the
    current concept labels in answers. Concept IDs remain stable.
legacy_concept_keys:
  bitstring: binary_word
  bitloop: binary_necklace
  inverse: complement
  self_inverse: self_complementary
  link: adjacent_xor
  sublink: preimage
  reverse: reversal
  self_link: fixed_necklace
  pattern: primitive_root
  self_pattern: primitive_necklace
  first: least_length
  partition_by_pattern_length: partition_by_least_spatial_period
  prime_number_proof: prime_length_necklaces
  chain: component
  structure: branching_sequence
  symmetry_bitstring: palindrome
  symmetry_bitloop: chirality
  symmetry_chain: component_reflection
  isomorphic_chain: isomorphic_components
concepts:
  bit:
    id: concept-001
    label: bit
    depends_on: []
    description: A bit is an element of the field F_2 = {0,1}.
    examples:
    - value: '0'
    - value: '1'
  variable:
    id: concept-002
    label: variable
    depends_on:
    - bit
    description: A variable such as x or y may represent a bit.
  binary_word:
    id: concept-003
    label: binary word
    depends_on:
    - bit
    description: A binary word is a finite ordered sequence of bits. Write its bits consecutively, as
      letters of a word. Leading zeros are significant. In this exposition the length n is positive.
    examples:
    - value: '0110'
    - value: '001111001011001010101011'
  length:
    id: concept-004
    label: length
    depends_on:
    - bit
    - variable
    - binary_word
    description: The length n of a binary word is its number of positions. Its rotation class is a necklace
      of length n, even if it contains fewer than n distinct words.
    examples:
    - value: The word 0101 has length 4.
  parity:
    id: concept-005
    label: parity
    depends_on:
    - bit
    - binary_word
    description: The Hamming weight is the number of ones. The parity of a word is the parity of its Hamming
      weight; rotation preserves both.
    examples:
    - value: 001101 has weight 3 and odd parity.
  variables:
    id: concept-006
    label: words with variable entries
    depends_on:
    - bit
    - variable
    - binary_word
    description: A word can be specified using variables for its entries; each assignment of bits gives
      a binary word.
    examples:
    - value: xxxyy becomes 00011 when x=0 and y=1.
  indices:
    id: concept-007
    label: cyclic indices
    depends_on:
    - bit
    - binary_word
    - length
    - variables
    description: Write w=w_0...w_(n-1), with indices taken modulo n when discussing adjacency or rotation.
      An index specifies a position; w_i is the bit at that position.
    examples:
    - value: For w=011, w_0=0 and w_1=w_2=1.
  permutation:
    id: concept-008
    label: permutation of positions
    depends_on:
    - bit
    - binary_word
    - indices
    description: A permutation rearranges the positions of a word. Rotation is a particular permutation
      of the cyclically ordered positions.
  rotation:
    id: concept-009
    label: cyclic rotation
    depends_on:
    - bit
    - binary_word
    - length
    - permutation
    description: The right rotation alpha sends w_0...w_(n-1) to w_(n-1)w_0...w_(n-2). Its matrix is R.
      Repeated rotations act on V_n as the cyclic group generated by alpha.
    examples:
    - value: alpha(1101)=1110
    - value: alpha(0010)=0001
  adjacent:
    id: concept-010
    label: cyclic adjacency
    depends_on:
    - bit
    - binary_word
    - indices
    description: Positions i and i+1 are adjacent, with indices modulo n. Thus the last and first positions
      are adjacent.
  rotation_class:
    id: concept-011
    label: rotation class
    depends_on:
    - binary_word
    - rotation
    description: The rotation class of a word is its orbit under cyclic rotation. It contains every distinct
      rotation of the word.
    examples:
    - value: The rotation class of 100 is {100,010,001}.
  minimum_rotation:
    id: concept-012
    label: least rotation
    depends_on:
    - binary_word
    - rotation_class
    description: Among the rotations of a fixed-length word, the lexicographically least word is also
      the one of least binary numerical value. It is a canonical representative of the necklace.
    examples:
    - value: The least rotation of 100 is 001; their binary values are 4 and 1.
  binary_necklace:
    id: concept-013
    label: binary necklace
    depends_on:
    - binary_word
    - rotation_class
    - minimum_rotation
    description: A binary necklace is a rotation class of binary words. Reflections are not identified.
      When a necklace is denoted by a representative word, the surrounding prose specifies that the whole
      rotation class is intended.
    examples:
    - value: 100, 010, and 001 represent the same necklace.
  unary_operation:
    id: concept-014
    label: unary operation
    depends_on:
    - binary_word
    - binary_necklace
    description: A unary operation takes one input. An operation on words induces an operation on necklaces
      only when the output rotation class is independent of the chosen representative.
  bitwise_not:
    id: concept-015
    label: bitwise NOT
    depends_on:
    - bit
    - binary_word
    - binary_necklace
    - unary_operation
    description: Bitwise NOT changes each 0 to 1 and each 1 to 0. This operation is complementation.
    examples:
    - value: NOT(001)=110
  complement:
    id: concept-016
    label: complement
    depends_on:
    - binary_word
    - rotation_class
    - binary_necklace
    - bitwise_not
    description: The complement of a word replaces each bit w_i by 1+w_i in F_2. It is an involution.
      Complementation commutes with rotation and therefore induces an involution on necklaces. It is not
      an inverse of adjacent XOR.
    examples:
    - value: The complement of 001101 is 110010.
  self_complementary:
    id: concept-017
    label: self-complementary necklace
    depends_on:
    - binary_word
    - rotation_class
    - binary_necklace
    - complement
    description: A necklace is self-complementary when its complement is a rotation of itself. Its least
      spatial period is even, and in its primitive root the second half is the complement of the first.
      No nonempty binary word equals its own complement.
    examples:
    - value: The necklace represented by 0011 is self-complementary.
    - value: The necklace represented by 010101 is self-complementary; its primitive root is 01.
  binary_operation:
    id: concept-018
    label: binary operation
    depends_on:
    - binary_word
    - binary_necklace
    description: A binary operation takes two inputs. Coordinatewise operations on equal-length words
      require aligned positions. They do not in general descend to independently chosen necklace representatives.
  addition_modulo_2:
    id: concept-019
    label: addition modulo two
    depends_on:
    - binary_operation
    description: Addition in F_2 obeys 0+0=0, 0+1=1, 1+0=1, and 1+1=0.
  bitwise_xor:
    id: concept-020
    label: bitwise XOR
    depends_on:
    - binary_word
    - binary_operation
    - addition_modulo_2
    description: Bitwise XOR adds equal-length words coordinatewise in F_2. It uses a fixed alignment
      of their positions.
    examples:
    - value: 0110 XOR 1010 = 1100
  adjacent_xor:
    id: concept-021
    label: adjacent-XOR map
    depends_on:
    - adjacent
    - rotation_class
    - binary_necklace
    - unary_operation
    - bitwise_xor
    description: The adjacent-XOR map, or binary Ducci map, is D(w)=w+alpha(w), so (Dw)_i=w_i+w_(i-1)
      modulo two. It commutes with rotation and thus induces a well-defined map on binary necklaces. Every
      image has even Hamming weight.
    examples:
    - value: D(0001)=1001
    - value: D(0)=0
    - value: D(1)=0
  preimage:
    id: concept-022
    label: preimage
    depends_on:
    - binary_necklace
    - complement
    - adjacent_xor
    description: A preimage of y under D is a word x satisfying D(x)=y. At word level, an even-weight
      target has exactly two preimages, which are complements; an odd-weight target has none. At necklace
      level the two word preimages can belong to one rotation class or two. Preimages form a relation,
      not an inverse function on all words.
    examples:
    - value: The word preimages of 0 are 0 and 1.
    - value: The word preimages of 1111 are 0101 and 1010, which represent one necklace.
  reversal:
    id: concept-023
    label: reversal
    depends_on:
    - binary_word
    - indices
    - permutation
    - rotation_class
    - binary_necklace
    - bitwise_not
    description: Reversal reads the bits in the opposite order. It is an involution on words and induces
      reflection on necklaces.
    examples:
    - value: The reversal of 00101 is 10100.
  fixed_necklace:
    id: concept-024
    label: fixed necklace
    depends_on:
    - length
    - binary_necklace
    - adjacent_xor
    - reversal
    description: 'A fixed necklace is a fixed point of the map induced by D: the image of a representative
      is a rotation of that representative. The following are six examples, not a complete list. Reversal
      and repetition preserve this property.'
    examples:
    - value: '0'
    - value: '011'
    - value: '0011101'
    - value: '000111101011001'
    - value: '000011111010100110001'
    - value: '000001000011000101001111010001110010010110111011001101010111111'
  primitive_root:
    id: concept-025
    label: primitive root and least spatial period
    depends_on:
    - binary_word
    - length
    - binary_necklace
    description: The primitive root of a word is its unique shortest word whose integral repetition gives
      the original word. Its length is the least spatial period and divides n. The corresponding primitive
      necklace is independent of the representative up to rotation. An abbreviated primitive representative
      must be expanded to the ambient width before applying a word-level operation.
    examples:
    - value: 001 is the primitive root of 001001001001.
    - value: At width 10, the primitive representative 01 is expanded to 0101010101.
  primitive_necklace:
    id: concept-026
    label: primitive necklace
    depends_on:
    - binary_necklace
    - primitive_root
    description: A word or necklace of length n is primitive when its least spatial period is n. Such
      a necklace contains n distinct rotations. At a prime length, every nonconstant necklace is primitive;
      the two constant necklaces have least spatial period one.
    examples:
    - value: 000111011 is primitive.
    - value: At length 7, 0000000 is not primitive.
  least_length:
    id: concept-027
    label: least length
    depends_on:
    - bit
    - binary_word
    - binary_necklace
    description: A first occurrence in a length-ordered catalogue means an occurrence at the least positive
      width for that catalogue property. It does not imply uniqueness at that width.
  power_set:
    id: concept-028
    label: power set and binary word space
    depends_on:
    - bit
    - binary_word
    - indices
    description: For a set S of n cyclically ordered positions, its power set P(S) is the set of all subsets
      of S. Characteristic words identify P(S) with V_n={0,1}^n=F_2^n. A 1 marks inclusion of the corresponding
      position. V_n has 2^n words and is distinct from the necklace quotient V_n/<alpha>.
    examples:
    - value: 'For S={x,y} in this order: 00 represents the empty set, 01 represents {y}, 10 represents
        {x}, and 11 represents {x,y}.'
  power_set_partition:
    id: concept-029
    label: partitions of the word space
    depends_on:
    - bit
    - binary_word
    - rotation_class
    - complement
    - power_set
    description: 'Complementary pairs and rotation classes each partition V_n. Grouping necklaces by weakly
      connected components of the adjacent-XOR functional digraph gives component basins: unions of rotation
      classes. Every word belongs to exactly one such basin. Necklaces refine the partition into basins.'
    examples:
    - value: V_3 contains 8 words, 4 necklaces, and 2 component basins.
  partition_by_least_spatial_period:
    id: concept-030
    label: partition by least spatial period
    depends_on:
    - bit
    - binary_word
    - rotation_class
    - complement
    - primitive_root
    - power_set
    - power_set_partition
    description: For each divisor d of n, group words by least spatial period d. These disjoint classes
      partition V_n. A necklace in that class contains d distinct words and is obtained by repeating a
      primitive length-d word.
  prime_length_necklaces:
    id: concept-031
    label: necklaces at prime length
    depends_on:
    - bit
    - binary_word
    - length
    - rotation_class
    - primitive_root
    - power_set
    - power_set_partition
    - partition_by_least_spatial_period
    description: If p is prime, each nonconstant length-p word has least spatial period p. Hence the nonconstant
      words form (2^p-2)/p primitive necklaces, and the total number of necklaces is 2+(2^p-2)/p.
    examples:
    - value: At p=7 there are 18 primitive necklaces and 20 necklaces in total.
  klein_four_group:
    id: concept-032
    label: complement and reversal
    depends_on:
    - binary_word
    - length
    - complement
    - bitwise_xor
    - power_set
    description: Complementation and reversal are commuting involutions, on words and on necklaces. They
      define an action of the Klein four-group; a particular orbit can have fewer than four elements because
      of stabilizers.
  component:
    id: concept-033
    label: weakly connected component
    depends_on:
    - binary_word
    - rotation_class
    - binary_necklace
    - adjacent_xor
    - preimage
    - least_length
    - power_set
    description: In the necklace functional digraph, each necklace has an edge to its adjacent-XOR image.
      A weakly connected component is connected after edge directions are forgotten. Each component has
      one directed cycle and incoming rooted trees. Its mass is the total number of binary words in its
      necklaces.
    examples:
    - value: At width 1, the necklaces represented by 0 and 1 form one component of mass 2.
  graph:
    id: concept-034
    label: functional digraph and graph type
    depends_on: []
    description: The functional digraph has necklaces as vertices and arrows from each necklace to its
      image under D. A graph type is a directed-graph isomorphism class of components. The catalogue identifier
      Gt-b records the cycle length t and branching word b; retain the existing catalogue identifiers.
    examples:
    - value: G1-20 has a fixed cycle vertex and one transient predecessor.
  cycle:
    id: concept-035
    label: directed cycle
    depends_on:
    - binary_necklace
    - adjacent_xor
    - component
    - graph
    description: A directed cycle is a periodic orbit of the necklace map. Its cycle length is its number
      of vertices; a fixed necklace has cycle length one. Necklace cycle length need not equal the temporal
      period of a word in fixed coordinates.
    examples:
    - value: The necklace represented by 011 is fixed, although the words 011, 110, and 101 form a three-cycle
        under D.
  tree:
    id: concept-036
    label: incoming rooted tree
    depends_on:
    - binary_necklace
    - adjacent_xor
    - preimage
    - power_set
    - component
    - graph
    - cycle
    description: Each cycle vertex roots an incoming tree of transient predecessors. Edges point toward
      the cycle; the incoming cycle edge is excluded from the tree edges. The root has one transient predecessor
      and one cycle predecessor in this necklace system.
  level:
    id: concept-037
    label: depth and level
    depends_on:
    - length
    - binary_necklace
    - preimage
    - primitive_root
    - power_set
    - component
    - tree
    description: The root is at depth zero. The tree depth is the greatest distance from a vertex to its
      root. The number of levels, including the root, is one more than the tree depth.
    examples:
    - value: At width 8 the unique component has tree depth 8 and 9 levels.
  branching_sequence:
    id: concept-038
    label: branching sequence
    depends_on:
    - parity
    - binary_necklace
    - self_complementary
    - preimage
    - tree
    - level
    description: The trees here are level-regular. Write their branching sequence (b_0,...,b_h), where
      b_0=2 counts the incoming cycle edge and the incoming tree edge at the root. For 0<j<h, b_j counts
      the children of a vertex at depth j. The leaf entry is b_h=0. As shorthand, concatenate these symbols
      to form a word over {0,1,2}.
    examples:
    - value: 'Width 1: 20'
    - value: 'Width 2: 210'
    - value: 'Width 4: 21120'
    - value: 'Width 8: 211212220'
    - value: 'Width 16: 21121222122222220'
  palindrome:
    id: concept-039
    label: palindrome
    depends_on:
    - bit
    - binary_word
    - reversal
    description: A binary word is a palindrome when reversal leaves the written word unchanged. Otherwise
      it is non-palindromic. Distinct words related by reversal form a reversal pair.
    examples:
    - value: 100001 is a palindrome.
    - value: 100010 and 010001 form a reversal pair.
  chirality:
    id: concept-040
    label: achiral and chiral necklaces
    depends_on:
    - bit
    - binary_word
    - rotation_class
    - binary_necklace
    - reversal
    - palindrome
    description: A necklace is achiral when reversal of a representative is a rotation of it. Otherwise
      it is chiral and has a distinct reflected necklace. A palindromic representative is sufficient but
      not necessary for achirality at even length. Geometrically, achirality means the circular arrangement
      has a reflection axis.
    examples:
    - value: The necklace represented by 01 is achiral, but neither 01 nor 10 is a palindrome.
  component_reflection:
    id: concept-041
    label: reflection of components
    depends_on:
    - binary_necklace
    - reversal
    - component
    - cycle
    - tree
    - branching_sequence
    description: Reflection induces an involution on the necklace functional digraph and maps components
      to components. A component is reflection-invariant if its vertex set is preserved; otherwise it
      belongs to a reflected pair of distinct components. A reflection-invariant component can contain
      chiral necklaces. A reflected pair contains two components, even when the catalogue lists it as
      one entry.
    examples:
    - value: 'At width 21, the catalogue has 20 reflection-invariant components and 398 reflected pairs:
        816 components represented by 418 entries.'
  isomorphic_components:
    id: concept-042
    label: isomorphic components
    depends_on:
    - binary_word
    - length
    - binary_necklace
    - primitive_root
    - power_set
    - component
    - graph
    - cycle
    - tree
    - branching_sequence
    - component_reflection
    description: Components are isomorphic when a vertex bijection preserves directed edges. In this system,
      cycle length and branching sequence determine the directed-graph type. Isomorphic components can
      have different masses because their necklaces can have different spatial periods.
    examples:
    - value: At width 12, two components of type G1-21120 have masses 16 and 48.
  tessellation:
    id: concept-043
    label: tessellation
    depends_on:
    - bit
    - bitwise_xor
    - binary_necklace
    - adjacent_xor
    - cycle
    description: A tessellation or tiling covers the plane with tiles without gaps or overlapping interiors.
      The geometric construction in the exposition derives periodic triangular tilings from periodic space-time
      diagrams. A space-time diagram itself is an array of successive states, not automatically a tessellation.
  space_time_diagram:
    id: concept-044
    label: space-time diagram
    depends_on:
    - adjacent_xor
    description: An array whose rows are successive words under the adjacent-XOR map, with columns recording
      spatial positions. A periodic necklace orbit can return with a spatial shift; this shift matters
      when repeating the word diagram in fixed coordinates.
catalogue_conventions:
  graph_identifier: G<cycle-length>-<branching-sequence>
  component_identifier: Existing Cn-x-i identifiers are retained; suffix a denotes an entry representing
    a reflected pair.
  reflected_pair_rows: One representative component is described in each row. Word and necklace counts
    in that row are per component, not doubled.
  total_components: reflection-invariant-components + 2 * reflected-component-pairs
  primitive_necklaces: Counts necklaces whose least spatial period equals the ambient width n.

current_calculator:
  endpoint: /api/bnct/calc
  input: bitstring is a binary word of length 1 to 4096; preserve leading zeros.
  counts: Exact mathematical counts and periods are decimal strings. Do not convert them through floating point.
  component_convention: Counts actual weakly connected components, not reflected component pairs.
  availability: A deferred or unavailable value is unknown, not zero. A truncated preview is not a complete list.
  graph_rows: A graph type can occur in several components with different word masses. total_words is the sum over all components of that type.
  fixed_necklace: Compare the least rotation of the word with the least rotation of its adjacent-XOR image, not the literal words.
